[project]
name = "floww2n"
version = "0.1.0"
description = "FlowW2N: Whispered-to-Normal Speech Conversion via Flow-Matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alias-free-torch==0.0.6",
    "auraloss==0.4.0",
    "datasets>=4.6.1",
    "einops>=0.8.2",
    "ema-pytorch>=0.2.3",
    "jiwer>=3.1.0",
    "librosa>=0.11.0",
    "numpy>=2.4.2",
    "onnxruntime>=1.24.3",
    "praat-parselmouth>=0.4.7",
    "safetensors>=0.7.0",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "speechbrain>=1.0.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=4.36.0",
    "wandb>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floww2n"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
